<div class="w-full h-screen flex justify-center items-center bg-zinc-950 px-4">
  <form
    class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-xl p-8 flex flex-col gap-6 shadow-md"
    #userForm="ngForm"
    (ngSubmit)="loginHandler(userForm)"
  >
    <h2 class="text-3xl font-semibold text-center text-zinc-100 mb-6">Login</h2>

    <!-- Username -->
    <div class="relative">
      <input
        type="text"
        placeholder="Username"
        name="name"
        ngModel
        required
        class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
      />
    </div>

    <!-- Password -->
    <div class="relative">
      <input
        type="password"
        placeholder="Password"
        name="password"
        ngModel
        required
        class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
      />
    </div>

    <!-- Checkbox -->
    <label class="flex items-center gap-2 text-zinc-400 text-sm select-none">
      <input
        type="checkbox"
        name="checkBox"
        ngModel
        required
        class="w-4 h-4 accent-[#66aa6e]"
      />
      I’m not a robot
    </label>

    <!-- Submit Button -->
    <div class="mt-4" *ngIf="userForm.valid">
      <app-solid-button buttonHeading="Login" class="w-full"></app-solid-button>
    </div>
  </form>
</div>
