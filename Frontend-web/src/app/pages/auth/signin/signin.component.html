<aside class="fixed top-0 flex w-screen justify-center">
  <app-response-status [status]="reponseStatus" [message]="reponseMessage" />
</aside>
<div
  class="w-full min-h-screen flex items-center justify-center bg-zinc-950 px-4"
>
  <form
    class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-xl p-8 flex flex-col gap-6 shadow-md"
    [formGroup]="signinForm"
    (ngSubmit)="signinHandler()"
  >
    <!-- Title -->
    <h2 class="text-center text-3xl font-semibold text-zinc-100 mb-6">
      Create your account
    </h2>

    <!-- Name -->
    <div class="relative">
      <input
        type="text"
        placeholder="Enter your name"
        formControlName="name"
        class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
      />
    </div>

    <!-- Email -->
    <div class="relative">
      <input
        type="text"
        placeholder="Enter your email"
        formControlName="email"
        class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
      />
    </div>

    <!-- Password -->
    <div class="relative">
      <input
        type="password"
        placeholder="Enter your password"
        formControlName="password"
        class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
      />
    </div>

    <!-- Confirm Password -->
    <div class="relative">
      <input
        type="password"
        placeholder="Confirm password"
        formControlName="confirmPassword"
        class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
      />
    </div>

    <!-- Robot Checkbox -->
    <label class="flex items-center gap-2 text-zinc-400 text-sm select-none">
      <input
        type="checkbox"
        formControlName="checkBox"
        class="w-4 h-4 accent-[#66aa6e]"
      />
      I’m not a robot
    </label>

    <!-- Submit Button -->
    <div *ngIf="signinForm.valid">
      <app-outline-button
        buttonHeading="Get started"
        class="w-full"
        [disabled]="button_disable"
      />
    </div>
  </form>
</div>
