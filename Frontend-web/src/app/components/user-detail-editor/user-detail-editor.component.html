<!-- <div class="w-full h-screen flex justify-center items-center bg-zinc-950 px-4"> -->
<form
  class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-xl p-8 flex flex-col gap-6 shadow-md"
  #updatedData="ngForm"
  (ngSubmit)="updateHandler(updatedData)"
>
  <div class="flex justify-end">
    <button
      class="hover:bg-gray-400 p-2 rounded-2xl"
      (click)="toggelHandlerButton()"
      type="button"
    >
      <img src="/asset/close.png" height="10" width="10" />
    </button>
  </div>
  <!-- Username -->
  <div class="relative">
    <input
      [type]="typeOfinput"
      [placeholder]="defaultValueToEdit"
      [name]="editOperation"
      ngModel
      required
      class="w-full px-4 py-3 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-[#66aa6e] focus:border-[#66aa6e] transition"
    />
  </div>
  <!-- Submit Button -->
  <div class="mt-4" *ngIf="updatedData.valid">
    <app-solid-button
      buttonHeading="update"
      class="w-full"
      [buttonDisabled]="buttonDisabled"
    ></app-solid-button>
  </div>
</form>
